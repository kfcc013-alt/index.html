<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뀨팀장의 간단한 심리학</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ededed;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #e94560; }
        p { color: #a9a9a9; margin-bottom: 30px; }
        canvas {
            border: 2px dashed #e94560;
            background-color: #16213e;
            cursor: crosshair;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        button:hover { background-color: #d13050; }
        #result {
            margin-top: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f3460;
            background-color: #ededed;
            display: inline-block;
            padding: 15px;
            border-radius: 8px;
            max-width: 500px;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <h1>🧠 AI 무의식 궤적 분석기</h1>
    <p>버튼을 누르고 5초 동안 네모 칸 안에서 마우스를 마음대로 움직여보세요.<br>최첨단(?) AI가 당신의 마우스 궤적을 분석해 심리 상태를 판별합니다.</p>
    
    <button id="startBtn">분석 시작 (5초)</button><br>
    <canvas id="canvas" width="500" height="300"></canvas>
    <div id="result">분석 결과가 여기에 표시됩니다.</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resultDiv = document.getElementById('result');
        
        let isDrawing = false;
        let isAnalyzing = false;

        // 재미있는 가짜 AI 분석 결과 리스트
        const aiResults = [
            "분석 결과: 현재 과제가 너무 하기 싫어 뇌가 파업을 선언한 상태입니다.",
            "분석 결과: 혈중 카페인 농도가 위험 수준으로 낮습니다. 커피 수혈이 시급합니다.",
            "분석 결과: 마우스 궤적에서 엄청난 예술적 재능이 발견되었습니다. 코딩 대신 미대에 가시는 건 어떨까요?",
            "분석 결과: 매우 안정적이고 기계적인 움직임입니다. 혹시 인간을 흉내 내는 AI이신가요?",
            "분석 결과: 혼돈 그 자체입니다. 어제 밤에 잠을 설치신 것이 마우스 픽셀 단위로 느껴집니다."
        ];

        startBtn.addEventListener('click', () => {
            if (isAnalyzing) return;
            
            // 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resultDiv.style.visibility = 'hidden';
            isAnalyzing = true;
            startBtn.innerText = "데이터 수집 중... (마우스를 움직이세요!)";
            startBtn.style.backgroundColor = "#0f3460";

            // 5초 타이머
            setTimeout(() => {
                isAnalyzing = false;
                startBtn.innerText = "분석 완료!";
                startBtn.style.backgroundColor = "#e94560";
                
                // 랜덤 결과 출력
                const randomResult = aiResults[Math.floor(Math.random() * aiResults.length)];
                resultDiv.innerText = randomResult;
                resultDiv.style.visibility = 'visible';
                
                setTimeout(() => { startBtn.innerText = "다시 분석하기"; }, 2000);
            }, 5000);
        });

        // 마우스 트래킹 그리기
        canvas.addEventListener('mousemove', (e) => {
            if (!isAnalyzing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
    </script>
</body>
</html>
